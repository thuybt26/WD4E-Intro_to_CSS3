name: Deploy CSS3 Assignment to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload CSS3 assignment
        uses: actions/upload-pages-artifact@v4
        with:
          path: './CSS-week2-HW2'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
